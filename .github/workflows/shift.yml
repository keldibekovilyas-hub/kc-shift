name: Отчёт за смену КЦ

on:
  # GitHub запускает расписание с опозданием на 1–5 часов (19.10.2026: вечерний 21:45 приходил в 23:50–00:40, утренний 07:40 —
  # в 12:10–13:05 по Алматы). Поэтому: запуски раньше и по два, а что собирать — решает алматинское время в самом шаге.
  schedule:
    - cron: "0 15 * * *"    # ~20:00 Алматы — снимок «после смены» + черновик за сегодня
    - cron: "50 16 * * *"   # ~21:50 Алматы — повтор (если первый опоздал или не сработал)
    - cron: "0 1 * * *"     # ~06:00 Алматы — снимок «до дня» + итоговый отчёт за вчера
    - cron: "40 1 * * *"    # ~06:40 Алматы — повтор, чтобы к 08:00 точно был
  workflow_dispatch:
    inputs:
      day:
        description: "День смены (ГГГГ-ММ-ДД), пусто = вчера по Алматы"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shift-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Almaty
      BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
      BINOTEL_API_KEY: ${{ secrets.BINOTEL_API_KEY }}
      BINOTEL_API_SECRET: ${{ secrets.BINOTEL_API_SECRET }}
      KC_SHEET_URL: ${{ secrets.KC_SHEET_URL }}
      REPORT_LOGIN: ${{ secrets.REPORT_LOGIN }}
      REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
      KC_SHIFT_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q openpyxl cryptography

      # режим по алматинскому времени: до 14:00 — утро (итог за ВЧЕРА), после — вечер (снимок после смены + черновик за СЕГОДНЯ).
      # Ручной запуск с датой — собрать именно этот день.
      - name: Снимок ответственных и отчёт
        run: |
          python -u build_shift.py --snapshot
          H=$(TZ=Asia/Almaty date +%H)
          DAY="${{ github.event.inputs.day }}"
          if [ -z "$DAY" ]; then
            if [ "$H" -lt 14 ]; then DAY=$(TZ=Asia/Almaty date -d yesterday +%F); else DAY=$(TZ=Asia/Almaty date +%F); fi
          fi
          echo "режим: час Алматы $H → день смены $DAY"
          python -u build_shift.py "$DAY" --out out

      # в репозитории остаются только снимки (id сделки → id ответственного) и ЗАШИФРОВАННЫЕ отчёты:
      # открытых имён и телефонов в публичном репозитории нет
      - name: Собрать сайт (зашифровать отчёты)
        run: python publish.py out site

      - name: Сохранить снимки и зашифрованные отчёты в репозиторий
        run: |
          git config user.name "shift-bot"; git config user.email "shift-bot@users.noreply.github.com"
          git add data/snapshots site
          git diff --cached --quiet || git commit -m "shift: $(date '+%F %H:%M')"
          # если за время сборки кто-то успел запушить — переигрываем наш коммит поверх, конфликты в .enc/снимках решаем в пользу свежей сборки
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true; sleep 10
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
