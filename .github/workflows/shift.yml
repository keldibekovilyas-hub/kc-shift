name: Отчёт за смену КЦ

on:
  # GitHub запускает расписание с опозданием на 1–5 часов, поэтому основной запуск — в полночь по Алматы с повтором,
  # и страховка утром. Заказчик 19.10.2026: «начинать в 00:00 по Алматы, после этого ничего не меняется, и обновлять
  # предыдущую смену» — ночной запуск собирает итог за закрывшийся день и пересобирает позавчерашний (дозревшие звонки/записи).
  schedule:
    - cron: "0 15 * * *"    # ~20:00 Алматы — черновик за сегодня (смена ещё идёт)
    - cron: "0 19 * * *"    # ~00:00 Алматы — снимок ответственных + итог за вчера + пересборка позавчера
    - cron: "40 19 * * *"   # ~00:40 Алматы — повтор
    - cron: "0 1 * * *"     # ~06:00 Алматы — страховка, если ночные запуски опоздали
  workflow_dispatch:
    inputs:
      day:
        description: "День смены (ГГГГ-ММ-ДД), пусто = вчера по Алматы"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shift-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Almaty
      BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
      BINOTEL_API_KEY: ${{ secrets.BINOTEL_API_KEY }}
      BINOTEL_API_SECRET: ${{ secrets.BINOTEL_API_SECRET }}
      KC_SHEET_URL: ${{ secrets.KC_SHEET_URL }}
      REPORT_LOGIN: ${{ secrets.REPORT_LOGIN }}
      REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
      KC_SHIFT_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q openpyxl cryptography

      # режим по алматинскому времени: до 14:00 — итог за ВЧЕРА и пересборка ПОЗАВЧЕРА; после 14:00 — черновик за СЕГОДНЯ.
      # Ручной запуск с датой — собрать именно этот день.
      - name: Снимок ответственных и отчёт
        run: |
          python -u build_shift.py --snapshot
          H=$(TZ=Asia/Almaty date +%H)
          DAY="${{ github.event.inputs.day }}"
          if [ -n "$DAY" ]; then
            python -u build_shift.py "$DAY" --out out
          elif [ "$H" -lt 14 ]; then
            Y=$(TZ=Asia/Almaty date -d yesterday +%F); Y2=$(TZ=Asia/Almaty date -d '2 days ago' +%F)
            echo "ночной режим (час Алматы $H): итог за $Y, пересборка $Y2"
            python -u build_shift.py "$Y" --out out
            python -u build_shift.py "$Y2" --out out
          else
            D=$(TZ=Asia/Almaty date +%F); echo "вечерний режим (час Алматы $H): черновик за $D"
            python -u build_shift.py "$D" --out out
          fi

      # в репозитории остаются только снимки (id сделки → id ответственного) и ЗАШИФРОВАННЫЕ отчёты:
      # открытых имён и телефонов в публичном репозитории нет
      - name: Собрать сайт (зашифровать отчёты)
        run: python publish.py out site

      - name: Сохранить снимки и зашифрованные отчёты в репозиторий
        run: |
          git config user.name "shift-bot"; git config user.email "shift-bot@users.noreply.github.com"
          git add data/snapshots site
          git diff --cached --quiet || git commit -m "shift: $(date '+%F %H:%M')"
          # если за время сборки кто-то успел запушить — переигрываем наш коммит поверх, конфликты в .enc/снимках решаем в пользу свежей сборки
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true; sleep 10
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
